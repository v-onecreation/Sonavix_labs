<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonavix Labs and Engineering — Detail, in Every Decibel.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;600;900&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a1c;--fg:#f2f5ff;--ac:#5ee7ff;--ac2:#8f7bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html,body{background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;overflow-x:hidden}
body{cursor:none}
@media (pointer:coarse){body{cursor:auto}.cur{display:none}}
h1,h2,h3,.disp{font-family:'Unbounded','Arial Black',sans-serif;font-weight:900;line-height:1.02}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#stage{position:fixed;inset:0;z-index:2;perspective:1000px;overflow:hidden}
.sc{position:absolute;inset:0;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(6,minmax(0,1fr));column-gap:14px;padding:76px 5vw 44px;align-items:center;opacity:0;pointer-events:none}
.sc>*{min-width:0;position:relative;z-index:1}
.sc>.gh,.sc>.o{position:absolute;z-index:0;left:0;top:50%;margin-top:-.52em;font-family:'Unbounded',sans-serif;font-weight:900;line-height:1;white-space:nowrap;color:transparent;-webkit-text-stroke:2px color-mix(in srgb,var(--fg) 17%,transparent);pointer-events:none}
.gh{font-size:clamp(8rem,30vw,28rem)}
.sc>.o{font-size:clamp(10rem,34vw,30rem);left:4vw}
.t{font-size:clamp(2rem,6vw,5.2rem);letter-spacing:-.03em}
.t em{font-style:normal;color:transparent;-webkit-text-stroke:2px var(--ac)}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-right:.26em}
.w i{display:inline-block;font-style:normal}
.big{font-size:clamp(2.6rem,13vw,11rem);letter-spacing:-.045em;display:flex;justify-content:center;flex-wrap:wrap}
.lt{display:inline-block;background:linear-gradient(180deg,var(--fg),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent;animation:fl 3.4s ease-in-out infinite;animation-delay:calc(var(--i)*.12s)}
@keyframes fl{50%{transform:translateY(-.07em) skewX(-4deg);filter:drop-shadow(0 0 22px var(--ac))}}
.d{font-size:clamp(.95rem,1.5vw,1.2rem);line-height:1.6;max-width:48ch;text-shadow:0 1px 16px var(--bg)}
.d b{display:block;font-family:'Unbounded';font-weight:300;font-size:clamp(1rem,2.4vw,1.7rem);margin-bottom:10px}
.tag{font-size:.82rem;font-weight:500;background:var(--ac);color:var(--bg);border-radius:99px;padding:7px 16px;width:max-content;max-width:100%}
.glass,.card{background:color-mix(in srgb,var(--fg) 10%,transparent);border:1px solid color-mix(in srgb,var(--fg) 30%,transparent);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border-radius:24px;box-shadow:0 24px 60px -28px #000d,inset 0 1px 0 color-mix(in srgb,var(--fg) 38%,transparent)}
.feat .d,.full .d,.ring .d,.curt .d,.diag .d,.form .d{background:color-mix(in srgb,var(--fg) 10%,transparent);border:1px solid color-mix(in srgb,var(--fg) 30%,transparent);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border-radius:22px;padding:18px 22px}
/* layouts */
.hero .k{grid-area:1/1/2/13;justify-self:center}.hero .t{grid-area:2/1/5/13}.hero .d{grid-area:5/4/6/10;text-align:center;justify-self:center}.hero .x{grid-area:6/1/7/13;overflow:hidden;align-self:end}
.stack .k{grid-area:1/1/2/7}.stack .t{grid-area:2/1/5/9;font-size:clamp(2.2rem,7.6vw,6.8rem)}.stack .d{grid-area:5/1/6/7}.stack .x{grid-area:6/1/7/10}
.nums .k{grid-area:1/1/2/7}.nums .t{grid-area:2/1/3/11;font-size:clamp(1.6rem,4vw,3.4rem)}.nums .x{grid-area:3/1/6/13}.nums .d{grid-area:6/1/7/9}
.cta .t{grid-area:1/1/2/13;text-align:center;font-size:clamp(1.8rem,5.6vw,4.6rem)}.cta .d{grid-area:2/3/3/11;text-align:center;justify-self:center}.cta .x{grid-area:6/1/7/13;text-align:center}
.gallery .t{grid-area:3/2/4/12;text-align:center;font-size:clamp(2rem,6.4vw,5.6rem)}.gallery .d{grid-area:4/4/5/10;text-align:center;justify-self:center}
.feat .k{grid-area:2/1/3/6}.feat .t{grid-area:3/1/5/8}.feat .d{grid-area:5/1/7/6}
.full .k{grid-area:3/1/4/5}.full .t{grid-area:4/1/7/10;align-self:end;font-size:clamp(2.2rem,7vw,6rem)}.full .d{grid-area:1/8/3/13}
.full .m{position:absolute;inset:0;z-index:0}.full .m .pic{border-radius:0}.full::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 92%,transparent),transparent 75%)}
.curt .t{grid-area:1/1/2/13;white-space:nowrap;overflow:visible;font-size:clamp(3rem,13vw,11rem);color:transparent;-webkit-text-stroke:2px var(--fg);letter-spacing:-.02em}.curt .d{grid-area:6/3/7/11;text-align:center;justify-self:center}.curt .k{grid-area:6/1/7/3}
.ring .t{grid-area:1/1/3/7;align-self:start;font-size:clamp(1.8rem,4.8vw,4.2rem)}.ring .d{grid-area:5/8/7/13}.ring .k{grid-area:5/1/6/5}
.ring .m .pic{width:auto;aspect-ratio:1;border-radius:50%}.ring .m::before{content:"";position:absolute;inset:-4%;margin:auto;aspect-ratio:1;height:108%;border:2px dashed var(--ac);border-radius:50%;animation:rot 30s linear infinite;opacity:.7}
@keyframes rot{to{transform:rotate(360deg)}}
.diag::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(112deg,transparent 0 56%,color-mix(in srgb,var(--ac) 20%,transparent) 56%);pointer-events:none}
.diag .k{grid-area:1/1/2/6}.diag .t{grid-area:2/1/4/8;font-size:clamp(2rem,5.4vw,4.6rem)}.diag .d{grid-area:4/1/6/7}.diag .x{grid-area:6/1/7/8}
.list .t{grid-area:1/1/3/10;font-size:clamp(2rem,5.6vw,4.8rem)}.list .x{grid-area:3/1/7/8}.list .k{grid-area:1/10/2/13}.list .d{grid-area:2/10/3/13}
.lab .k{grid-area:1/1/2/6}.lab .t{grid-area:2/1/3/9;font-size:clamp(1.8rem,4.6vw,4rem)}.lab .d{grid-area:3/1/4/9}.lab .x{grid-area:4/1/7/8}
.cards .k{grid-area:1/1/2/6}.cards .t{grid-area:2/1/3/13;font-size:clamp(1.8rem,4.6vw,4rem)}.cards .x{grid-area:3/1/7/13;align-self:stretch}
.quote .k{grid-area:1/1/2/6}.quote .t{grid-area:2/1/4/13;font-size:clamp(2rem,6.4vw,5.6rem)}.quote .d{grid-area:4/1/5/8}.quote .x{grid-area:5/1/7/9}
.step .k{grid-area:2/5/3/13}.step .t{grid-area:3/5/5/13;font-size:clamp(2.2rem,6vw,5.4rem)}.step .d{grid-area:5/5/7/11}
.form .k{grid-area:4/1/5/6}.form .t{grid-area:1/1/4/7;font-size:clamp(2rem,5.4vw,4.6rem)}.form .d{grid-area:5/1/7/6}.form .x{grid-area:1/8/7/13;align-self:center}
.cities .t{grid-area:1/1/2/13;text-align:center;font-size:clamp(1.4rem,3.4vw,2.6rem)}.cities .x{grid-area:2/1/7/13;align-self:stretch}
/* parts */
.m{align-self:stretch;display:grid;place-items:stretch}
.m .pic{height:100%;aspect-ratio:auto;max-height:none}
.row{display:flex;gap:clamp(16px,5vw,70px);flex-wrap:wrap;justify-content:space-between;width:100%}
.row>div{border-left:2px solid var(--ac);padding-left:clamp(10px,2vw,24px)}
.stat{font-family:'Unbounded';font-weight:900;font-size:clamp(3rem,12vw,9.5rem);line-height:1;color:var(--fg)}
.row small{font-size:clamp(.85rem,1.4vw,1.1rem);opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1.5px dashed var(--fg);border-radius:99px;padding:9px 18px;text-decoration:line-through;text-decoration-color:var(--ac);text-decoration-thickness:2px;opacity:.7;background:color-mix(in srgb,var(--bg) 50%,transparent)}
.chip.on{border:1.5px solid var(--ac);background:var(--ac);color:var(--bg);text-decoration:none;opacity:1;font-weight:500}
.quote .chip:nth-child(odd){rotate:-3deg}.quote .chip:nth-child(even){rotate:2.5deg}
.opt{text-decoration:none;opacity:.9;cursor:none}.opt.on{opacity:1}
.btn{display:inline-block;color:var(--bg);background:var(--ac);padding:17px 36px;border-radius:99px;font-weight:500;text-decoration:none;font-size:1.05rem;border:0;font-family:inherit;transition:transform .3s,box-shadow .3s;box-shadow:0 14px 50px -12px var(--ac)}
.btn:hover{transform:scale(1.08) rotate(-2deg)}
.tick{display:flex;gap:44px;width:max-content;white-space:nowrap;font:900 clamp(1rem,2.4vw,1.8rem) 'Unbounded',sans-serif;opacity:.75;animation:mq 26s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.lst{list-style:none;padding:0}
.lst li{font:600 clamp(1.05rem,2.3vw,1.8rem)/1.2 'Unbounded',sans-serif;padding:clamp(12px,2.4vh,24px) 0;border-top:1.5px solid color-mix(in srgb,var(--fg) 40%,transparent);transition:padding .35s,color .35s}
.lst li:hover{padding-left:24px;color:var(--ac)}
.eq{padding:18px 22px;display:grid;gap:12px}
.eq svg{width:100%;height:clamp(60px,14vh,120px)}
.bands{display:flex;justify-content:space-between;gap:10px}
.bands label{display:grid;gap:6px;justify-items:center;font-size:.8rem}
.bands input{writing-mode:vertical-lr;direction:rtl;height:clamp(60px,12vh,100px);accent-color:var(--ac);cursor:none}
.cards .x{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{padding:clamp(12px,2vh,20px);transition:transform .35s,box-shadow .35s;text-align:left}
.card:nth-child(2){margin-top:6vh}.card:nth-child(3){margin-top:12vh}
.card:hover{transform:translateY(-8px) rotateX(5deg);box-shadow:0 0 50px -10px var(--ac)}
.card h3{font-size:clamp(.9rem,1.5vw,1.1rem);margin:12px 0 6px;color:var(--ac)}
.card p{font-size:clamp(.85rem,1.3vw,1rem);opacity:.92}
.card .pic{aspect-ratio:16/10;height:auto;max-height:24vh;border-radius:14px}
.form .x{padding:clamp(16px,3vh,28px);display:grid;gap:12px}
.form input[type=text],.form textarea{width:100%;font:inherit;color:var(--fg);background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid color-mix(in srgb,var(--fg) 35%,transparent);border-radius:14px;padding:13px 16px;outline:0;resize:none}
.form input:focus,.form textarea:focus{border-color:var(--ac)}
.form small{min-height:1.2em;opacity:.9}
.cw{display:flex;gap:16px;height:100%}
.city{flex:1;position:relative;overflow:hidden;display:flex;align-items:flex-end;transition:flex .6s cubic-bezier(.2,.8,.2,1);padding:0}
.city:hover{flex:2.3}
.city .pic{position:absolute;inset:0;height:100%;max-height:none;aspect-ratio:auto;border-radius:0}
.city h3{position:relative;z-index:3;font-size:clamp(1.8rem,6.4vw,5.4rem);padding:20px;color:#fff;text-shadow:0 4px 30px #000}
/* pics */
.ab{fill:var(--bg)}.af{fill:var(--fg)}.sb,.sf{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.sb{stroke:var(--bg)}.sf{stroke:var(--fg)}
.pic{position:relative;width:100%;aspect-ratio:4/3;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 30px 60px -28px #000b;transition:transform .25s ease-out,box-shadow .4s}
.pic svg{position:absolute;inset:0;width:100%;height:100%;padding:8%;transition:transform .7s cubic-bezier(.2,.8,.2,1),filter .5s}
.pic:hover{box-shadow:0 40px 80px -24px var(--ac)}
.pic:hover svg{transform:scale(1.2) rotate(-5deg);filter:drop-shadow(0 18px 18px #0008)}
.pic::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0002 0 2px,transparent 2px 5px);opacity:0;transition:opacity .3s;pointer-events:none}
.pic:hover::after{opacity:1}
.pic .gl{position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#fffa,transparent 42%);opacity:0;transition:opacity .3s;mix-blend-mode:overlay;pointer-events:none}
.pic:hover .gl{opacity:1}
.pic figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 16px 14px;background:linear-gradient(transparent,#000d);color:#fff;font-size:.9rem;transform:translateY(101%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:2}
.pic:hover figcaption{transform:none}
@media (hover:none){.pic figcaption{transform:none}}
/* chrome */
.nav{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 5vw 14px;mix-blend-mode:difference;color:#fff}
.nav b{font-family:'Unbounded';font-size:.85rem;display:flex;gap:10px;align-items:center}
.nav svg{width:28px;height:28px}
.nav div{display:flex;gap:clamp(10px,2.2vw,24px);align-items:center}
.nav a{color:#fff;text-decoration:none;font-size:.85rem;padding-bottom:3px;border-bottom:2px solid transparent}
.nav a.on,.nav a:hover{border-color:#fff}
#snd{border:1px solid #fff;border-radius:99px;padding:4px 12px!important;font-size:.75rem!important}
.rail{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:6;display:grid;gap:4px}
.rail i{width:18px;height:14px;display:grid;place-items:center}
.rail i::after{content:"";width:6px;height:6px;border-radius:9px;background:var(--fg);opacity:.4;transition:.4s}
.rail i.on::after{height:22px;background:var(--ac);opacity:1}
#hud{position:fixed;left:5vw;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;font:500 .8rem 'Unbounded',sans-serif;mix-blend-mode:difference;color:#fff}
.hint{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;z-index:6;font-size:.8rem;animation:bob 1.6s infinite;transition:opacity .4s;translate:-50% 0}
@keyframes bob{50%{transform:translateY(8px)}}
.prog{position:fixed;left:0;top:0;height:4px;z-index:7;background:var(--ac);width:0}
.cur{position:fixed;left:0;top:0;z-index:99;pointer-events:none;border-radius:50%;mix-blend-mode:difference}
#dot{width:8px;height:8px;background:#fff;margin:-4px 0 0 -4px}
#ring{width:38px;height:38px;border:1.5px solid #fff;margin:-19px 0 0 -19px;transition:width .25s,height .25s,margin .25s,background .25s}
#ring.h{width:78px;height:78px;margin:-39px 0 0 -39px;background:#fff}
.rp{position:fixed;z-index:98;width:10px;height:10px;margin:-5px;border:2px solid var(--ac);border-radius:50%;pointer-events:none;animation:rp .7s ease-out forwards}
@keyframes rp{to{transform:scale(14);opacity:0}}
#wipe{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--ac);color:var(--bg);font-family:'Unbounded';font-weight:900;font-size:clamp(2.2rem,11vw,8rem);letter-spacing:-.03em;transform:translateY(101%);pointer-events:none;transition:transform .55s cubic-bezier(.77,0,.18,1)}
#wipe.a{transform:none;pointer-events:all}#wipe.b{transform:translateY(-101%)}
#load{position:fixed;inset:0;z-index:100;display:grid;place-items:center;color:#eef1ff}
#load .p{position:absolute;left:0;right:0;height:50.5%;background:#05060c;transition:transform 1s cubic-bezier(.77,0,.18,1)}
#load .t2{top:0}#load .b2{bottom:0}
#load.go .t2{transform:translateY(-101%)}#load.go .b2{transform:translateY(101%)}
#load .m2{position:relative;text-align:center;display:grid;justify-items:center;gap:20px;transition:opacity .4s,transform .8s}
#load.go .m2,#load.go #pc{opacity:0}#load.go .m2{transform:scale(1.6)}
#load svg{width:96px;height:96px;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}
#ln{font-size:clamp(1.8rem,8vw,5rem);display:flex}
#ln span{opacity:.1;transition:opacity .2s,color .2s,text-shadow .2s}
#ln span.on{opacity:1;color:#3ae8ff;text-shadow:0 0 26px #3ae8ff,3px 0 #ff4fa3}
#eqb{display:flex;gap:4px;align-items:flex-end;height:44px}
#eqb i{width:5px;height:100%;border-radius:3px;background:linear-gradient(#ff4fa3,#3ae8ff);transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes eq{from{transform:scaleY(.12)}to{transform:scaleY(1)}}
#lb{width:min(320px,70vw);height:3px;background:#1b1e33}
#lb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3ae8ff,#b45cff,#ff4fa3)}
#lp{font-size:.85rem;color:#8b90b0;min-height:1.3em}
#pc{position:absolute;right:5vw;bottom:4vh;font-family:'Unbounded';font-weight:900;font-size:clamp(3rem,14vw,9rem);color:#fff;opacity:.9;transition:opacity .3s}
/* instruments */
.play .k{grid-area:1/9/2/13;justify-self:end;text-align:right}.play .t{grid-area:1/1/2/9;font-size:clamp(1.6rem,3.6vw,3rem)}.play .x{grid-area:2/1/7/13;align-self:stretch;min-height:0}
.inst{position:relative}
.nt{position:absolute;top:-6px;color:var(--ac);font-size:28px;pointer-events:none;animation:nt 1.4s ease-out forwards;z-index:5;text-shadow:0 0 14px var(--ac)}
@keyframes nt{to{transform:translateY(-130px) rotate(14deg);opacity:0}}
.lab{position:absolute;left:0;right:0;bottom:-2px;text-align:center;opacity:.85;font-size:.85rem;pointer-events:none;text-shadow:0 1px 10px var(--bg)}
/* piano */
.pno{height:100%;display:grid;align-content:center;touch-action:none}
.pcase{position:relative;background:linear-gradient(#3a2216,#150b07);padding:26px 16px 0;border-radius:18px 18px 6px 6px;box-shadow:0 40px 70px -24px #000,inset 0 2px 0 #ffffff26,inset 0 -2px 0 #0008}
.pcase::before{content:"SONAVIX";position:absolute;top:7px;left:50%;transform:translateX(-50%);font:600 10px Unbounded,sans-serif;letter-spacing:.45em;color:#e2bd77;opacity:.85}
.keys{position:relative;height:clamp(150px,34vh,300px);background:#0c0c0c;border-top:7px solid #6a1216;box-shadow:inset 0 8px 10px -6px #000}
.wk{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,#d9d2bf 0%,#fffdf6 7%,#fbf8ee 78%,#d6cfba 100%);border:1px solid #8c8470;border-top:0;border-radius:0 0 8px 8px;box-shadow:inset 0 -12px 14px -9px #00000038,0 7px 0 #b3ab94;transform-origin:top;transition:transform .06s,box-shadow .06s,filter .06s;z-index:1;cursor:none}
.wk i{position:absolute;bottom:10px;left:0;right:0;text-align:center;font:500 11px Arial,sans-serif;color:#8a846f;font-style:normal}
.wk.on{transform:perspective(500px) rotateX(-3deg) translateY(5px);box-shadow:inset 0 -6px 10px -6px #0007,0 2px 0 #b3ab94;filter:brightness(.93) sepia(.15);background:linear-gradient(180deg,#d9d2bf 0%,#f6f2e4 7%,color-mix(in srgb,var(--ac) 35%,#fbf8ee) 85%,#cfc7b0 100%)}
.bk{position:absolute;top:0;height:62%;background:linear-gradient(180deg,#4a4a4d 0,#111 7%,#1d1d20 70%,#000);border-radius:0 0 6px 6px;box-shadow:inset 2px 0 3px #ffffff33,inset -2px 0 3px #0009,0 9px 9px -2px #000b;z-index:2;transition:transform .06s,box-shadow .06s;cursor:none}
.bk::after{content:"";position:absolute;left:16%;right:16%;top:0;height:78%;background:linear-gradient(90deg,#ffffff22,transparent 45%);border-radius:0 0 5px 5px}
.bk.on{transform:translateY(4px) scaleY(.985);box-shadow:inset 0 0 6px #000a,0 3px 5px -2px #000b}
/* drums */
.kit{width:100%;height:100%;display:block;touch-action:manipulation;filter:drop-shadow(0 20px 24px #0009)}
.dr{cursor:none;transform-box:fill-box;transform-origin:center}
.dr.hit{animation:dh .23s}
@keyframes dh{40%{transform:scale(.955) translateY(3px);filter:brightness(1.25)}}
.dr.cy{transform-origin:50% 0}
.dr.cy.hit{animation:cw 1.2s ease-out}
@keyframes cw{8%{transform:rotate(-6deg);filter:brightness(1.4)}25%{transform:rotate(5deg)}45%{transform:rotate(-3.5deg)}65%{transform:rotate(2deg)}85%{transform:rotate(-1deg)}}
.rip{fill:none;stroke:var(--ac);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:rip .5s ease-out forwards;pointer-events:none}
